name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-release:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            container: ubuntu:20.04
            target: x86_64
            baseline: ubuntu20.04
          - runner: ubuntu-24.04-arm
            container: ubuntu:22.04
            target: aarch64
            baseline: ubuntu22.04
    name: Linux ${{ matrix.target }} release (${{ matrix.baseline }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/tmp/runner-ca-certificates.crt:ro
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      ARCHIVE: mini-tunnel-linux-${{ matrix.target }}-${{ matrix.baseline }}.tar.gz
    steps:
      - name: Install build prerequisites
        if: matrix.target == 'x86_64'
        run: |
          sed -i 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          apt-get -o APT::Update::Error-Mode=any \
            -o Acquire::Retries=5 -o Acquire::https::Timeout=20 \
            -o Acquire::https::CAInfo=/tmp/runner-ca-certificates.crt update
          DEBIAN_FRONTEND=noninteractive apt-get \
            -o APT::Update::Error-Mode=any \
            -o Acquire::Retries=5 -o Acquire::https::Timeout=20 \
            -o Acquire::https::CAInfo=/tmp/runner-ca-certificates.crt install \
            --no-install-recommends -y build-essential ca-certificates curl pkg-config tar gzip

      - name: Install build prerequisites
        if: matrix.target == 'aarch64'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl pkg-config tar gzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          case "$ARCHIVE" in
            mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz) test "$(uname -m)" = x86_64 ;;
            mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
          cargo build --locked --release --bin mini-tunnel
          mkdir dist
          install -m 0755 target/release/mini-tunnel dist/mini-tunnel
          dist/mini-tunnel --version
          dist/mini-tunnel --help >/dev/null
          ldd dist/mini-tunnel
          if ldd dist/mini-tunnel | grep -q 'not found'; then
            echo 'Unresolved runtime library dependency' >&2
            exit 1
          fi
          tar -C dist -czf "$ARCHIVE" mini-tunnel
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload release staging artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 1

  desktop-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: mini-tunnel-macos-x86_64.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: mini-tunnel-macos-aarch64.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: mini-tunnel-windows-x86_64.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: mini-tunnel-windows-aarch64.zip
    name: Desktop ${{ matrix.target }} release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      ARCHIVE: ${{ matrix.archive }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin mini-tunnel --target "$RUST_TARGET"
          mkdir dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "target/$RUST_TARGET/release/mini-tunnel.exe" dist/mini-tunnel.exe
            ./dist/mini-tunnel.exe --version
            ./dist/mini-tunnel.exe --help >/dev/null
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/mini-tunnel.exe' -DestinationPath '$ARCHIVE'"
            powershell -NoProfile -Command '$hash = (Get-FileHash -Algorithm SHA256 $env:ARCHIVE).Hash.ToLower(); [IO.File]::WriteAllText("$env:ARCHIVE.sha256", "$hash  $env:ARCHIVE`n", [Text.Encoding]::ASCII)'
          else
            install -m 0755 "target/$RUST_TARGET/release/mini-tunnel" dist/mini-tunnel
            dist/mini-tunnel --version
            dist/mini-tunnel --help >/dev/null
            tar -C dist -czf "$ARCHIVE" mini-tunnel
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Attest desktop release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload desktop staging artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-release
      - desktop-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release staging artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          merge-multiple: true
          path: staging

      - name: Verify release staging artifacts
        env:
          EXPECTED_NAMES: mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz.sha256 mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz.sha256 mini-tunnel-macos-x86_64.tar.gz mini-tunnel-macos-x86_64.tar.gz.sha256 mini-tunnel-macos-aarch64.tar.gz mini-tunnel-macos-aarch64.tar.gz.sha256 mini-tunnel-windows-x86_64.zip mini-tunnel-windows-x86_64.zip.sha256 mini-tunnel-windows-aarch64.zip mini-tunnel-windows-aarch64.zip.sha256
        run: |
          set -euo pipefail
          actual_names="$(find staging -type f -printf '%f\n' | sort)"
          expected_names="$(printf '%s\n' $EXPECTED_NAMES | sort)"
          diff -u <(printf '%s\n' "$expected_names") <(printf '%s\n' "$actual_names")
          for archive in staging/mini-tunnel-linux-*.tar.gz staging/mini-tunnel-macos-*.tar.gz; do
            test "$(tar -tzf "$archive")" = mini-tunnel
          done
          for archive in staging/mini-tunnel-windows-*.zip; do
            unzip -tq "$archive"
            test "$(unzip -Z1 "$archive")" = mini-tunnel.exe
          done
          (
            cd staging
            sha256sum --check --strict ./*.sha256
          )
          cat staging/*.sha256 > staging/SHA256SUMS

      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber staging/*.tar.gz staging/*.sha256 staging/SHA256SUMS
          else
            gh release create "$TAG" \
              --verify-tag \
              --generate-notes \
              --title "$TAG" \
              staging/*.tar.gz staging/*.sha256 staging/SHA256SUMS
          fi
