name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep only the latest verification for a ref; a new run also replaces a stuck run.
  cancel-in-progress: true

jobs:
  linux-release:
    name: Linux x86_64 release binary (Ubuntu 20.04 baseline)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl pkg-config tar gzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin mini-tunnel
          mkdir -p dist
          install -m 0755 target/release/mini-tunnel dist/mini-tunnel
          dist/mini-tunnel --version
          dist/mini-tunnel --help >/dev/null
          ldd dist/mini-tunnel
          if ldd dist/mini-tunnel | grep -q 'not found'; then
            echo 'Unresolved runtime library dependency' >&2
            exit 1
          fi
          tar -C dist -czf mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz mini-tunnel
          sha256sum mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz > mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz.sha256

      - name: Upload Linux x86_64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-tunnel-linux-x86_64-ubuntu20.04
          path: |
            mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz
            mini-tunnel-linux-x86_64-ubuntu20.04.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  linux-release-arm64:
    name: Linux ARM64 release binary (Ubuntu 22.04 baseline)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl pkg-config tar gzip

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          cargo build --locked --release --bin mini-tunnel
          mkdir -p dist
          install -m 0755 target/release/mini-tunnel dist/mini-tunnel
          dist/mini-tunnel --version
          dist/mini-tunnel --help >/dev/null
          ldd dist/mini-tunnel
          if ldd dist/mini-tunnel | grep -q 'not found'; then
            echo 'Unresolved runtime library dependency' >&2
            exit 1
          fi
          tar -C dist -czf mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz mini-tunnel
          sha256sum mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz > mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz.sha256

      - name: Upload Linux ARM64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-tunnel-linux-aarch64-ubuntu22.04
          path: |
            mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz
            mini-tunnel-linux-aarch64-ubuntu22.04.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mini_tunnel_owner
          POSTGRES_PASSWORD: mini_tunnel_owner
          POSTGRES_DB: mini_tunnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_tunnel_test -d mini_tunnel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_INCREMENTAL: 0
      MINI_TUNNEL_TEST_DATABASE_URL: postgres://mini_tunnel_owner:mini_tunnel_owner@localhost:5432/mini_tunnel_test
      MINI_TUNNEL_TEST_APP_DATABASE_URL: postgres://mini_tunnel_runtime:mini_tunnel_runtime@localhost:5432/mini_tunnel_test
      PGPASSWORD: mini_tunnel_owner
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Prepare least-privilege runtime database role
        run: |
          psql --host localhost --username mini_tunnel_owner --dbname mini_tunnel_test <<'SQL'
          CREATE ROLE mini_tunnel_runtime LOGIN PASSWORD 'mini_tunnel_runtime';
          GRANT CONNECT ON DATABASE mini_tunnel_test TO mini_tunnel_runtime;
          GRANT USAGE ON SCHEMA public TO mini_tunnel_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE mini_tunnel_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO mini_tunnel_runtime;
          SQL

      - name: Run real PostgreSQL multi-instance integration
        run: cargo +stable test -p mini-tunnel-coordinator postgres_coordinator_instances_serialize_join_and_restore_state -- --ignored --nocapture

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Check systemd service sandbox settings
        if: runner.os == 'Linux'
        run: python3 deploy/systemd/check_units.py

      - name: Audit Cargo dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          # rsa is an unbuilt optional dependency of SQLx's disabled MySQL driver; the advisory has no fix.
          cargo audit --ignore RUSTSEC-2023-0071

      - name: Validate Prometheus rules
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          prometheus_version=3.15.1
          archive="$RUNNER_TEMP/prometheus-${prometheus_version}.linux-amd64.tar.gz"
          checksums="$RUNNER_TEMP/prometheus-${prometheus_version}-sha256sums.txt"
          release_url="https://github.com/prometheus/prometheus/releases/download/v${prometheus_version}"
          curl --fail --location --retry 3 --output "$archive" \
            "$release_url/prometheus-${prometheus_version}.linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$checksums" \
            "$release_url/sha256sums.txt"
          (cd "$RUNNER_TEMP" && grep "prometheus-${prometheus_version}.linux-amd64.tar.gz$" "$checksums" | sha256sum --check -)
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 \
            "prometheus-${prometheus_version}.linux-amd64/promtool"
          "$RUNNER_TEMP/promtool" check rules deploy/prometheus/mini-tunnel-alerts.yml
          "$RUNNER_TEMP/promtool" test rules deploy/prometheus/mini-tunnel-alerts.test.yml

      - name: Run workspace tests
        run: cargo +stable test --workspace

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets -- --deny warnings

      - name: Run privileged Linux TUN packet round trip
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          build_messages="$RUNNER_TEMP/mini-tunnel-agent-test-build.jsonl"
          cargo +stable test -p mini-tunnel-agent --lib --no-run --message-format=json > "$build_messages"
          test_binary="$(python3 - "$build_messages" <<'PY'
          import json
          import sys

          for line in open(sys.argv[1], encoding="utf-8"):
              message = json.loads(line)
              target = message.get("target", {})
              if message.get("profile", {}).get("test") and target.get("name") == "mini_tunnel_agent":
                  print(message["executable"])
                  break
          else:
              raise SystemExit("mini-tunnel-agent test binary was not built")
          PY
          )"
          sudo modprobe tun || true
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iptables
          sudo "$test_binary" --exact tun_device::tests::privileged_linux_tun_assigns_addresses_mtu_and_cleans_up --ignored --nocapture
          command -v tc
          sudo "$test_binary" --exact tunnel::tests::privileged_linux_veth_quic_probe_loss_and_recovery --ignored --nocapture
          sudo "$test_binary" --exact tunnel::tests::privileged_linux_veth_degraded_udp_triggers_mesh_tcp_fallback --ignored --nocapture
          sudo "$test_binary" --exact tunnel::tests::privileged_linux_veth_mesh_promotes_reliable_session_to_direct_udp --ignored --nocapture
          command -v iptables
          sudo "$test_binary" --exact stun::tests::privileged_linux_snat_discovers_server_reflexive_address_on_same_socket --ignored --nocapture

      - name: Run privileged Windows Wintun packet round trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1'
          Invoke-WebRequest 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expectedHash = '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'
          if ($actualHash -ne $expectedHash) {
            throw "Wintun archive SHA-256 mismatch: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $dll = Join-Path $extract 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) { throw "Official x64 Wintun DLL missing: $dll" }

          $buildMessages = Join-Path $env:RUNNER_TEMP 'mini-tunnel-agent-test-build.jsonl'
          cargo +stable test -p mini-tunnel-agent --lib --no-run --message-format=json | Out-File -FilePath $buildMessages -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Failed to build mini-tunnel-agent tests' }
          $testExecutable = $null
          foreach ($line in Get-Content $buildMessages) {
            $message = $line | ConvertFrom-Json
            if ($message.reason -eq 'compiler-artifact' -and $message.profile.test -and $message.target.name -eq 'mini_tunnel_agent') {
              $testExecutable = $message.executable
              break
            }
          }
          if (-not $testExecutable) { throw 'mini-tunnel-agent test binary was not built' }
          Copy-Item -Path $dll -Destination (Join-Path (Split-Path $testExecutable) 'wintun.dll') -Force
          & $testExecutable --exact tun_device::tests::privileged_windows_wintun_routes_packets_and_cleans_up --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Privileged Windows Wintun runtime test failed' }

      - name: Run privileged macOS utun packet round trip
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          build_messages="$RUNNER_TEMP/mini-tunnel-agent-test-build.jsonl"
          cargo +stable test -p mini-tunnel-agent --lib --no-run --message-format=json > "$build_messages"
          test_binary="$(python3 - "$build_messages" <<'PY'
          import json
          import sys

          for line in open(sys.argv[1], encoding="utf-8"):
              message = json.loads(line)
              target = message.get("target", {})
              if message.get("profile", {}).get("test") and target.get("name") == "mini_tunnel_agent":
                  print(message["executable"])
                  break
          else:
              raise SystemExit("mini-tunnel-agent test binary was not built")
          PY
          )"
          sudo "$test_binary" --exact tun_device::tests::privileged_macos_utun_routes_packets_and_cleans_up --ignored --nocapture
