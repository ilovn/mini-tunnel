name: Rust dependency security audit

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Cargo dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check RustSec advisories
        # These advisories only reach the active graph through SQLx's disabled optional drivers.
        # SQLx 0.9 requires Rust 1.94, above this project's Rust 1.89 MSRV.
        # Keep both drivers out of the graph while auditing all other dependencies/advisories.
        run: |
          for driver in sqlx-mysql sqlx-sqlite; do
            driver_tree="$(cargo tree -i "$driver" --target all --locked --prefix none 2>/dev/null)"
            if [ -n "$driver_tree" ]; then
              printf '%s\n' "$driver_tree"
              echo "The $driver became active; remove its advisory exception and resolve its vulnerability." >&2
              exit 1
            fi
          done
          cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
