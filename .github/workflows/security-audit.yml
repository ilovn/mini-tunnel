name: Rust dependency security audit

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Cargo dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check RustSec advisories
        # SQLx's disabled MySQL driver leaves rsa in Cargo.lock; no fixed release is available.
        # CI ignores only this advisory while continuing to check every other dependency.
        run: cargo audit --ignore RUSTSEC-2023-0071
