global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/mini-tunnel-alerts.yml

scrape_configs:
  - job_name: mini-tunnel-coordinator
    scheme: https
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8443
    tls_config:
      ca_file: /etc/mini-tunnel/tls/coordinator-ca.pem
      server_name: coordinator.internal

  - job_name: mini-tunnel-relay
    scheme: http
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 127.0.0.1:42002
