[workspace]
resolver = "3"
members = [
    "crates/mini-tunnel-protocol",
    "crates/mini-tunnel-coordinator",
    "crates/mini-tunnel-agent",
    "crates/mini-tunnel-relay",
    "crates/mini-tunnel-cli",
    "vendor/rtc-ice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bytes = "1.10.1"
directories = "6.0.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
if-addrs = "0.15.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hmac = "0.13.0"
ipnet = "2.12.2"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.5", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rtc-ice = { path = "vendor/rtc-ice", default-features = false, features = ["crypto-ring"] }
rtc-shared = { version = "0.21.1", default-features = false }
sansio = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3.3"
tun-rs = { version = "2.8.16", default-features = false, features = ["async_tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }
x509-parser = "0.18.0"
